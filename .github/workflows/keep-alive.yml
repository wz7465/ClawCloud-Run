name: Multi-Site Login

on:
  schedule:
    - cron: "0 0 * * *"   # 每天执行一次
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      - name: Run renew script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node renew.js

      - name: Save updated sites.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sites.json login timestamps"
